# ORBITAL SENTINEL — full backend stack.
#
#   docker compose up --build
#
# The gateway is the only published port; it proxies the worker and serves
# the 3D module and three.js to the browser.
services:
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      WORKER_PORT: 8811
    expose:
      - "8811"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8811/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      GATEWAY_PORT: 8800
      WORKER_URL: http://worker:8811
      TICK_HZ: 5
      AUTOPLAY: "true"
    ports:
      - "8800:8800"
    depends_on:
      worker:
        condition: service_healthy
